name: pass241

services:
  app:
    build:
      context: ./docker/php
    container_name: pass241-app
    volumes:
      - ./backend:/var/www/html
      # vendor/ vit dans un volume Docker, pas sur le montage Windows.
      # Les iterateurs SPL de PHP (DirectoryIterator, FilesystemIterator,
      # RecursiveDirectoryIterator, donc Symfony Finder et File::allFiles)
      # tronquent silencieusement la lecture des dossiers de plus d'un millier
      # d'entrees sur ce type de montage : 1201 fichiers vus sur 2025 reels.
      # Cela fausse la generation du classmap Composer et la decouverte de
      # fichiers par les paquets. Voir docs/00-decisions.md, decision D-013.
      - vendor:/var/www/html/vendor
      # Vues compilees, cache et sessions : machine-generes, jamais lus depuis
      # Windows. Sur le montage, Blade echoue a horodater ses fichiers
      # (« touch(): Utime failed ») — chmod accorde l'ecriture, mais utime
      # exige la propriete du fichier, que le montage ne peut pas accorder.
      # storage/logs reste sur le montage : celui-la, on veut le lire.
      - framework:/var/www/html/storage/framework
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [pass241]

  nginx:
    image: nginx:1.27-alpine
    container_name: pass241-nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [pass241]

  postgres:
    image: postgres:16-alpine
    container_name: pass241-postgres
    # random_page_cost : 4.0 par defaut, une valeur calibree pour des disques a
    # plateaux, ou une lecture aleatoire coutait quatre fois une lecture
    # sequentielle. Sur SSD l'ecart est marginal, et 1.1 est la valeur retenue
    # partout ailleurs (decision D-065).
    #
    # Ce n'est pas un reglage cosmetique : il decide des PLANS. Mesure sur
    # 500 000 commandes, la requete de stock de `StockLedger::sold()` — celle
    # qui s'execute au rendu de chaque page publique d'evenement — passe d'une
    # jointure par fusion parcourant tout l'index a une boucle imbriquee, soit
    # 31,7 ms a 13,7 ms. Le gain croit avec le volume : la boucle imbriquee
    # suit les ventes du type de billet, la fusion suivait le total des
    # commandes de la plateforme.
    #
    # TOUT DEPLOIEMENT DOIT PORTER LE MEME REGLAGE. Un serveur gere ailleurs
    # qu'ici (base managee, machine dediee) revient a 4.0 par defaut et perd
    # silencieusement ce gain — rien ne casse, tout ralentit.
    command:
      - postgres
      - -c
      - random_page_cost=1.1
    environment:
      POSTGRES_DB: pass241
      POSTGRES_USER: pass241
      POSTGRES_PASSWORD: secret
    # 5432 et 5433 sont deja occupes sur la machine hote
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pass241 -d pass241"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pass241]

  redis:
    image: redis:7-alpine
    container_name: pass241-redis
    # 6379 est deja occupe sur la machine hote
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [pass241]

  mailpit:
    image: axllent/mailpit:latest
    container_name: pass241-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [pass241]

  # Services actives une fois Laravel installe :
  #   docker compose --profile workers up -d
  horizon:
    build:
      context: ./docker/php
    container_name: pass241-horizon
    command: php artisan horizon
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
      # Vues compilees, cache et sessions : machine-generes, jamais lus depuis
      # Windows. Sur le montage, Blade echoue a horodater ses fichiers
      # (« touch(): Utime failed ») — chmod accorde l'ecriture, mais utime
      # exige la propriete du fichier, que le montage ne peut pas accorder.
      # storage/logs reste sur le montage : celui-la, on veut le lire.
      - framework:/var/www/html/storage/framework
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: [workers]
    networks: [pass241]

  reverb:
    build:
      context: ./docker/php
    container_name: pass241-reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - vendor:/var/www/html/vendor
      # Vues compilees, cache et sessions : machine-generes, jamais lus depuis
      # Windows. Sur le montage, Blade echoue a horodater ses fichiers
      # (« touch(): Utime failed ») — chmod accorde l'ecriture, mais utime
      # exige la propriete du fichier, que le montage ne peut pas accorder.
      # storage/logs reste sur le montage : celui-la, on veut le lire.
      - framework:/var/www/html/storage/framework
    depends_on:
      redis:
        condition: service_healthy
    profiles: [workers]
    networks: [pass241]

volumes:
  pgdata:
  redisdata:
  vendor:
  framework:

networks:
  pass241:
    driver: bridge
