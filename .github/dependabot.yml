version: 2

updates:
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
    groups:
      php-patches:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    groups:
      web-patches:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /mobile
    schedule:
      interval: weekly
    groups:
      mobile-patches:
        update-types: [patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
