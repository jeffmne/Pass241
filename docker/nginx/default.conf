server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 10M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Les fichiers Vite portent une empreinte : une nouvelle version a une
    # nouvelle URL. Aucun cache public des pages de paiement ou de session.
    location ^~ /build/assets/ {
        try_files $uri =404;
        expires 1y;
        gzip on;
        gzip_vary on;
        gzip_types text/css application/javascript image/svg+xml;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Laravel pose aussi ces protections lorsque PHP est atteint
        # directement. A la frontiere HTTP, Nginx conserve sa propre copie
        # (utile aux erreurs et fichiers statiques) et masque celle de PHP
        # pour ne jamais envoyer deux valeurs du meme en-tete.
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
        # Nginx est le proxy de bord de ce deploiement : ne jamais propager un
        # X-Forwarded-For fourni par le client, qui falsifierait l'adresse IP
        # utilisee par les throttles et la piste d'audit Laravel.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_HOST $host;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ \.php(?:/|$) { return 404; }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
