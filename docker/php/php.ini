; La limite metier des pieces justificatives est de 2 Mo, appliquee par la
; validation applicative (Livewire\Organizations\Settings). Les valeurs PHP
; sont volontairement plus hautes : si elles etaient a 2 Mo, un fichier de
; taille limite serait rejete par PHP avant d'atteindre la validation, et
; l'organisateur verrait un echec silencieux au lieu d'un message clair.
upload_max_filesize = 8M
post_max_size = 10M

; Marge pour le televersement d'une piece d'identite sur une connexion mobile.
max_execution_time = 120
memory_limit = 256M

; Durcissement commun a tous les environnements.
expose_php = Off
display_errors = Off
log_errors = On
cgi.fix_pathinfo = 0

; OPcache reste compatible avec le montage de developpement : les timestamps
; sont verifies, mais les scripts compiles sont conserves entre les requetes.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
